<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d15"/>
      <stop offset="50%" style="stop-color:#13131b"/>
      <stop offset="100%" style="stop-color:#1f1f27"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c1ff"/>
      <stop offset="100%" style="stop-color:#8083ff"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4edea3"/>
      <stop offset="100%" style="stop-color:#00a572"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Full bleed background - covers entire canvas -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Decorative gradient circles -->
  <circle cx="100" cy="100" r="200" fill="#c0c1ff" opacity="0.03"/>
  <circle cx="412" cy="412" r="250" fill="#4edea3" opacity="0.03"/>
  
  <!-- Main circle with glow -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- Inner circle -->
  <circle cx="256" cy="230" r="100" fill="none" stroke="#c0c1ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Rupee symbol -->
  <text x="256" y="265" font-family="Arial, sans-serif" font-size="130" font-weight="bold" fill="url(#accentGrad)" text-anchor="middle" filter="url(#glow)">₹</text>
  
  <!-- Growth arrow -->
  <path d="M140 380 Q200 320 260 350 T380 290" fill="none" stroke="url(#greenGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="380,290 402,268 380,312" fill="#4edea3" filter="url(#glow)"/>
  
  <!-- Text FINANCE -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#c0c1ff" text-anchor="middle" letter-spacing="8">FINANCE</text>
  
  <!-- Text TRACK -->
  <text x="256" y="485" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#4edea3" text-anchor="middle" letter-spacing="14">TRACK</text>
</svg>
