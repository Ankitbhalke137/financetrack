<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d15"/>
      <stop offset="50%" style="stop-color:#13131b"/>
      <stop offset="100%" style="stop-color:#1f1f27"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c1ff"/>
      <stop offset="100%" style="stop-color:#8083ff"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4edea3"/>
      <stop offset="100%" style="stop-color:#00a572"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Full bleed background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#c0c1ff" opacity="0.03"/>
  <circle cx="412" cy="412" r="250" fill="#4edea3" opacity="0.03"/>
  
  <!-- Main circle -->
  <circle cx="256" cy="220" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="220" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="220" r="90" fill="none" stroke="#c0c1ff" stroke-width="1" opacity="0.15"/>
  
  <!-- Rupee -->
  <text x="256" y="252" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="url(#accentGrad)" text-anchor="middle" filter="url(#glow)">₹</text>
  
  <!-- Growth arrow -->
  <path d="M140 360 Q200 300 260 330 T380 270" fill="none" stroke="url(#greenGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="380,270 402,248 380,292" fill="#4edea3" filter="url(#glow)"/>
  
  <!-- FINANCE text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#c0c1ff" text-anchor="middle" letter-spacing="8">FINANCE</text>
  
  <!-- TRACK text -->
  <text x="256" y="465" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#4edea3" text-anchor="middle" letter-spacing="12">TRACK</text>
</svg>
